name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish. Publish primitives before a govuk-react version that needs it.
        type: choice
        options:
          - govuk-react
          - primitives
        default: govuk-react

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter "./packages/${{ inputs.package }}" build
      - run: npm stage publish --access public --tag "$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] ?? 'latest'")"
        working-directory: packages/${{ inputs.package }}
