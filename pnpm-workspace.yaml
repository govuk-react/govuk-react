packages:
  - packages/*
  - examples/*
  - benchmark

allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  # Sass's optional file watcher, unused by the Astro example's build.
  '@parcel/watcher': false
  # Astro's image service, unused by the primitives browser tests.
  sharp: false
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - govuk-frontend-react@1.0.0-alpha.5 || 1.0.0-alpha.6 || 1.0.0-alpha.7
